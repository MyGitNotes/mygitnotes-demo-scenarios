schema_version: 4
workspace:
  title: "MyGitNotes demo scenarios"
  default_notebook: trpg-en
notebooks:
  - id: trpg-en
    title: "Call of Cthulhu session prep"
    root: trpg-en
    default_view: kanban
    statuses:
      - { name: "reference", color: gray }
      - { name: "hidden", color: purple }
      - { name: "revealed", color: amber }
      - { name: "resolved", color: green }
  - id: trpg-zh-tw
    title: "克蘇魯的呼喚：備團"
    root: trpg-zh-tw
    default_view: kanban
    statuses:
      - { name: "參考", color: gray }
      - { name: "未揭露", color: purple }
      - { name: "已揭露", color: amber }
      - { name: "已解決", color: green }
  - id: contract-en
    title: "Contract review"
    root: contract-en
    default_view: list
  - id: contract-zh-tw
    title: "合約審閱"
    root: contract-zh-tw
    default_view: list
    statuses:
      - { name: "進行中", color: blue }
      - { name: "已完成", color: green }
  - id: daily-en
    title: "Daily journal and weekly review"
    root: daily-en
    default_view: list
  - id: daily-zh-tw
    title: "每日日誌與週回顧"
    root: daily-zh-tw
    default_view: list
    statuses:
      - { name: "進行中", color: blue }
      - { name: "已完成", color: green }
  - id: study-en
    title: "Course notes: linear algebra"
    root: study-en
    default_view: list
    statuses:
      - { name: "new", color: purple }
      - { name: "learning", color: blue }
      - { name: "review", color: amber }
      - { name: "known", color: green }
  - id: study-zh-tw
    title: "課程筆記：線性代數"
    root: study-zh-tw
    default_view: list
    statuses:
      - { name: "新卡片", color: purple }
      - { name: "學習中", color: blue }
      - { name: "複習中", color: amber }
      - { name: "已熟悉", color: green }
  - id: reading-en
    title: "Literature reading"
    root: reading-en
    default_view: list
  - id: reading-zh-tw
    title: "文獻閱讀"
    root: reading-zh-tw
    default_view: list
    statuses:
      - { name: "進行中", color: blue }
      - { name: "已完成", color: green }
  - id: project-en
    title: "Product spec"
    root: project-en
    default_view: kanban
    statuses:
      - { name: "backlog", color: gray }
      - { name: "specifying", color: purple }
      - { name: "building", color: amber }
      - { name: "shipped", color: green }
  - id: project-zh-tw
    title: "產品規格"
    root: project-zh-tw
    default_view: kanban
    statuses:
      - { name: "待排", color: gray }
      - { name: "規格中", color: purple }
      - { name: "開發中", color: amber }
      - { name: "已上線", color: green }
  - id: teaching-en
    title: "Teaching: lesson slides"
    root: teaching-en
    default_view: list
  - id: teaching-zh-tw
    title: "教學：課堂簡報"
    root: teaching-zh-tw
    default_view: list
    statuses:
      - { name: "進行中", color: blue }
      - { name: "已完成", color: green }
  - id: designer-en
    title: "Designer's notebook: brand identity"
    root: designer-en
    default_view: list
    statuses:
      - { name: "reference", color: gray }
      - { name: "exploring", color: purple }
      - { name: "in review", color: amber }
      - { name: "approved", color: green }
  - id: designer-zh-tw
    title: "設計師筆記本：品牌識別"
    root: designer-zh-tw
    default_view: list
    statuses:
      - { name: "參考", color: gray }
      - { name: "探索中", color: purple }
      - { name: "審閱中", color: amber }
      - { name: "已定案", color: green }
  - id: portfolio-en
    title: "Portfolio: case studies and series"
    root: portfolio-en
    default_view: list
    statuses:
      - { name: "draft", color: gray }
      - { name: "polishing", color: amber }
      - { name: "ready", color: green }
  - id: portfolio-zh-tw
    title: "作品集：案例與系列作"
    root: portfolio-zh-tw
    default_view: list
    statuses:
      - { name: "草稿", color: gray }
      - { name: "修飾中", color: amber }
      - { name: "可發布", color: green }
  - id: pm-en
    title: "Release management: Cubbyshelf v1.1"
    root: pm-en
    default_view: kanban
    statuses:
      - { name: "reference", color: gray }
      - { name: "planned", color: purple }
      - { name: "in progress", color: blue }
      - { name: "blocked", color: red }
      - { name: "done", color: green }
  - id: pm-zh-tw
    title: "版本發布管理：貨架小幫手 v1.1"
    root: pm-zh-tw
    default_view: kanban
    statuses:
      - { name: "參考", color: gray }
      - { name: "待開始", color: purple }
      - { name: "進行中", color: blue }
      - { name: "被卡住", color: red }
      - { name: "已完成", color: green }
